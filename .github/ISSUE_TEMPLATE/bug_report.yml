name: Bug report
description: Something is broken or a mash came out wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the order of clips you added and what the output looked like.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Safari 18, ...
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Web app
        - CLI
        - Tests / build
