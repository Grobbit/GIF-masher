name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Build CLI
        run: npm run build:cli

      - name: Smoke-test the CLI
        run: |
          node -e "
          const { GIFEncoder, quantize, applyPalette } = require('gifenc');
          const fs = require('node:fs');
          const gif = GIFEncoder();
          for (const color of [[255,0,0],[0,255,0]]) {
            const data = new Uint8Array(8*8*4);
            for (let i = 0; i < 64; i++) data.set([...color, 255], i*4);
            const palette = quantize(data, 256, { format: 'rgb565' });
            gif.writeFrame(applyPalette(data, palette, 'rgb565'), 8, 8, { palette, delay: 100 });
          }
          gif.finish();
          fs.writeFileSync('/tmp/a.gif', gif.bytes());
          fs.writeFileSync('/tmp/b.gif', gif.bytes());
          "
          node dist/cli/gif-masher.mjs /tmp/a.gif /tmp/b.gif -o /tmp/out.gif --quiet
          test -s /tmp/out.gif
          echo "CLI produced $(wc -c < /tmp/out.gif) bytes"
